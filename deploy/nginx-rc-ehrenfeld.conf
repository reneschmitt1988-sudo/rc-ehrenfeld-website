# nginx-Serverblock für rc-ehrenfeld.de
# Ablegen unter /etc/nginx/sites-available/rc-ehrenfeld.de
# und mit ln -s nach /etc/nginx/sites-enabled/ aktivieren.
# Certbot ergänzt den HTTPS-Block automatisch (siehe README).

server {
    listen 80;
    listen [::]:80;
    server_name rc-ehrenfeld.de www.rc-ehrenfeld.de;

    root /var/www/rc-ehrenfeld;
    index index.html;

    # Logs 14 Tage behalten (siehe Datenschutzerklärung Abschnitt 3)
    access_log /var/log/nginx/rc-ehrenfeld.access.log;
    error_log  /var/log/nginx/rc-ehrenfeld.error.log;

    # Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Komprimierung
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Schriften, Bilder, CSS, JS lange cachen
    location ~* \.(woff2|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Saubere Adressen: /impressum statt /impressum.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Versteckte Dateien nicht ausliefern
    location ~ /\. {
        deny all;
    }
}
