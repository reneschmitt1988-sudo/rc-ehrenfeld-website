# Test-Adresse rce.gt-rasch.de, solange rc-ehrenfeld.de noch nicht auf den
# Server zeigt. Gleiche App, aber für Suchmaschinen gesperrt.
# Ablegen unter /etc/nginx/sites-available/rce-test, aktivieren per Symlink.
# Nach dem Umzug auf rc-ehrenfeld.de wieder entfernen.

server {
    listen 80;
    listen [::]:80;
    server_name rce.gt-rasch.de;

    access_log /var/log/nginx/rc-ehrenfeld.access.log;
    error_log  /var/log/nginx/rc-ehrenfeld.error.log;

    client_max_body_size 15m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /assets/ {
        alias /var/www/rc-ehrenfeld/cms/public/assets/;
        expires 7d;
        access_log off;
    }
    location /uploads/ {
        alias /var/www/rc-ehrenfeld/cms/data/uploads/;
        expires 30d;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
