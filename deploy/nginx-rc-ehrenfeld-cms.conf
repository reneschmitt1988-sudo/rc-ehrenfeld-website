# nginx-Serverblock für rc-ehrenfeld.de mit CMS (Stufe 2)
# Ersetzt nginx-rc-ehrenfeld.conf (Stufe 1, statisch).
# Ablegen unter /etc/nginx/sites-available/rc-ehrenfeld.de
# Certbot ergänzt den HTTPS-Block automatisch.

server {
    listen 80;
    listen [::]:80;
    server_name rc-ehrenfeld.de www.rc-ehrenfeld.de;

    access_log /var/log/nginx/rc-ehrenfeld.access.log;
    error_log  /var/log/nginx/rc-ehrenfeld.error.log;

    client_max_body_size 15m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/html;
    gzip_min_length 1024;

    # Statische Dateien liefert nginx direkt
    location /assets/ {
        alias /var/www/rc-ehrenfeld/cms/public/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
    location /uploads/ {
        alias /var/www/rc-ehrenfeld/cms/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Alles andere an die Node-App
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
